name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests progress pyyaml termcolor pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --name="ZHKU校园网自动登录" `
            --onefile `
            --console `
            --add-data "config.yml;." `
            main.py

      - name: Prepare release package
        shell: pwsh
        run: |
          mkdir release
          copy dist\ZHKU校园网自动登录.exe release\
          copy config.yml release\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZHKU校园网自动登录
          path: release/
          retention-days: 90
